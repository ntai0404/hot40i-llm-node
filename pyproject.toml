[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hot40i-llm-node"
version = "0.2.0"
description = "Host-side laboratory and tooling for a flash-resident LLM runtime on Hot 40i"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "jsonschema>=4.23"]

[project.scripts]
hot40 = "host.device_lab.cli:app"
hot40-gateway = "host.gateway.app:main"

[tool.setuptools.packages.find]
include = ["host*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
