schema_version: 1
goal_gate: FINAL_DEPLOYMENT
selection_policy: lowest priority number among ready mandatory tasks; optional tasks only when activation condition
  is explicitly satisfied/decided
tasks:
- id: R00
  title: Resolve and pin upstream references
  phase: research
  priority: 1
  depends_on: []
  optional: false
  goal: Make all external reference code reproducible before it affects implementation/benchmark decisions.
  allowed_paths:
  - third_party/**
  - research/**
  - artifacts/**
  implementation:
  - Read third_party/manifest.yaml, third_party/LOCK.yaml and research/sources.yaml.
  - Refresh requested refs from current official upstream release/project pages when the handoff seed is stale.
  - Run scripts/resolve_upstreams.py (or equivalent recorded git ls-remote commands) to resolve full 40-hex commit
    SHAs.
  - Update third_party/LOCK.yaml with retrieval date, requested/matched ref, full commit, license and role/provenance
    notes. Do not vendor full repositories unless a later task needs checked-out source.
  - Optionally verify selected sources with scripts/sync_third_party.py --require-locked before basing code or benchmarks
    on them.
  verification:
  - python scripts/handoff_check.py --quick
  - Verify every priority S/A code source has either a resolved full commit SHA or an explicit evidence-backed deferred
    reason.
  required_artifacts:
  - third_party/LOCK.yaml
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - OpenAI gpt-oss, Harmony, Codex and every source actually used for implementation/benchmark decisions are immutable/pinned.
  - No benchmark or copied code cites an unpinned mutable branch.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: R01
  title: Revalidate scientific/model assumptions
  phase: research
  priority: 2
  depends_on:
  - R00
  optional: false
  goal: Ensure the handoff thesis reflects current official model facts and the cited out-of-core systems before
    coding against them.
  allowed_paths:
  - docs/**
  - research/**
  - third_party/**
  - artifacts/**
  implementation:
  - Check OpenAI model card/repo, Harmony, Apple LLM-in-a-Flash/MLX/on-device reports and the A-tier systems/mobile
    references listed in research/sources.yaml, including PowerInfer-2, PowerServe, ActiveFlow, EdgeMoE, MoE-Infinity
    and SmallThinker.
  - Update docs only when a material fact changed.
  - Write a contradiction log if a source disagrees with the repository model contract.
  verification:
  - python scripts/handoff_check.py --quick
  required_artifacts:
  - artifacts/runs/<run>/sources.json
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - Every material architecture/quantization fact used by the runtime has an authoritative source.
  - Any uncertainty is explicitly marked UNKNOWN rather than guessed.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: R02
  title: Harden autonomous device-tool boundary
  phase: research
  priority: 3
  depends_on:
  - R00
  optional: false
  goal: Give coding agents a safe repository-level device interface for stock-Android phases.
  allowed_paths:
  - host/device_lab/**
  - tests/python/**
  - docs/**
  - artifacts/**
  implementation:
  - Remove ordinary call-sites that depend on arbitrary public shell strings.
  - Expose named probes and explicit temp-binary/push/pull/forward operations.
  - Add tests proving destructive ADB/fastboot-like commands are rejected by repository wrappers.
  - Do not claim this sandbox prevents an agent from invoking an external executable directly; AGENTS.md remains
    binding.
  verification:
  - pytest -q
  - python scripts/handoff_check.py --quick
  required_artifacts:
  - tests/python/test_device_safety.py
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - Repository device API has explicit safe operations and rejection tests.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: D00
  title: Verify USB-C ADB connectivity
  phase: device
  priority: 10
  depends_on:
  - R00
  - R02
  optional: false
  goal: Establish a reproducible laptop-to-phone development transport without destructive operations.
  allowed_paths:
  - host/**
  - scripts/**
  - tests/**
  - PROJECT_STATE.yaml
  - artifacts/**
  implementation:
  - Detect authorized device; select explicit serial if multiple.
  - Verify push/pull in /data/local/tmp using a harmless nonce file.
  - Establish adb forward localhost:18080 -> device:8080 and verify forwarding setup.
  - Repeat reconnect/transport checks; record failures instead of hiding them.
  verification:
  - hot40 devices
  - Repository-defined connectivity test/harness must exit 0.
  required_artifacts:
  - artifacts/runs/<run>/adb_devices.txt
  - artifacts/runs/<run>/transport.json
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - Exactly one target serial is recorded in PROJECT_STATE.yaml.
  - Push/pull succeeds without root.
  - ADB transport is stable enough for subsequent tasks.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: D01
  title: Capture normalized device manifest
  phase: device
  priority: 11
  depends_on:
  - D00
  optional: false
  goal: Record exact Hot 40i hardware/software state from the physical unit.
  allowed_paths:
  - host/**
  - schemas/**
  - artifacts/**
  - PROJECT_STATE.yaml
  implementation:
  - Collect getprop, CPU/meminfo, mounts, partitions, block sysfs, thermal zones and CPU topology using named safe
    probes.
  - Normalize stable fields into device-manifest.json while retaining raw probe output.
  - Validate against schemas/device_manifest.schema.json.
  verification:
  - hot40 probe --out artifacts/device-manifest.json
  - python scripts/validate_artifact.py schemas/device_manifest.schema.json artifacts/device-manifest.json
  required_artifacts:
  - artifacts/device-manifest.json
  - artifacts/runs/<run>/raw/
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - Manifest identifies product/model/build/SoC-visible CPU topology, MemTotal, storage/block evidence and thermal
    sources.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: D02
  title: Derive safe RSS budget
  phase: device
  priority: 12
  depends_on:
  - D01
  optional: false
  goal: "Measure\u2014not guess\u2014the maximum repeatable process RSS budget under stock Android."
  allowed_paths:
  - device/bench/**
  - host/**
  - benchmarks/**
  - PROJECT_STATE.yaml
  - artifacts/**
  implementation:
  - Collect MemTotal/MemAvailable/swap/zram at cold reboot, settled idle, screen-off and representative native load.
  - Run a bounded allocation pressure probe that never intentionally triggers system OOM.
  - Derive conservative LLM_SAFE_RSS_BUDGET with headroom; store decision in PROJECT_STATE.yaml.
  verification:
  - At least three repeated settled measurements.
  - Validate benchmark JSON.
  required_artifacts:
  - benchmarks/stock/memory_budget.json
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - safe_rss_budget_bytes is non-null and justified by measurements.
  - No OOM/factory/system instability occurred.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: D03
  title: Identify storage/controller evidence
  phase: device
  priority: 13
  depends_on:
  - D01
  optional: false
  goal: Determine actual storage characteristics of this exact device variant rather than relying on retail specs.
  allowed_paths:
  - host/**
  - benchmarks/**
  - artifacts/**
  implementation:
  - Gather block/sysfs/model/queue evidence available without root.
  - Classify UFS/eMMC only when evidence supports it; otherwise record UNKNOWN.
  - Record filesystem/location used for model benchmarks.
  verification:
  - Cross-check at least two independent on-device evidence sources when available.
  required_artifacts:
  - benchmarks/stock/storage_identity.json
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - Storage classification has device evidence or is explicitly UNKNOWN.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: D04
  title: Benchmark expert-shaped flash access
  phase: device
  priority: 14
  depends_on:
  - D02
  - D03
  optional: false
  goal: Measure the I/O patterns that determine whether expert streaming can work.
  allowed_paths:
  - device/bench/**
  - host/**
  - tests/**
  - benchmarks/**
  - artifacts/**
  implementation:
  - Extend h40_io_bench for sequential and deterministic random regions at 4KiB,64KiB,256KiB,1MiB and expert-shaped
    8/16/32MiB reads.
  - Report throughput, IOPS where meaningful, p50/p95/p99 latency, CPU time and exact file size/location.
  - Run cold/warm-cache variants where feasible and distinguish page-cache effects.
  - Run repeated and sustained samples while collecting thermal/frequency data.
  verification:
  - Host unit test for benchmark argument parsing.
  - Android ARM64 binary exits 0 on device.
  - Three repeat runs produce valid JSON.
  required_artifacts:
  - benchmarks/stock/storage.json
  - artifacts/runs/<run>/storage_samples.jsonl
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - Expert-shaped read latency/throughput is known with percentiles.
  - Results distinguish at least sequential vs random/expert-shaped access.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: D05
  title: Benchmark CPU and DRAM
  phase: device
  priority: 15
  depends_on:
  - D02
  optional: false
  goal: Establish compute/memory ceilings and useful core-affinity configurations on T606.
  allowed_paths:
  - device/bench/**
  - host/**
  - benchmarks/**
  - tests/**
  - artifacts/**
  implementation:
  - Implement/read benchmark for memcpy/read bandwidth and representative FP16/INT8/INT4 or available low-bit matvec
    kernels.
  - Measure A75-focused, A55-focused and mixed/all-core configurations using real CPU topology.
  - Capture frequency and temperature with each run.
  verification:
  - Repeat each configuration at least 3 times.
  - Validate output schema.
  required_artifacts:
  - benchmarks/stock/cpu_memory.json
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - Memory bandwidth and representative matvec throughput are measured.
  - Best thread/core configuration is evidence-based.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: D06
  title: Build sustained thermal harness
  phase: device
  priority: 16
  depends_on:
  - D01
  optional: false
  goal: Make thermal throttling visible in every long inference/benchmark run.
  allowed_paths:
  - host/**
  - device/bench/**
  - benchmarks/**
  - tests/**
  - artifacts/**
  implementation:
  - Implement host collector for thermal zones, CPU frequencies, battery state/current when readable and process
    RSS.
  - Use monotonic timestamps and JSONL.
  - Provide start/stop integration for benchmark commands.
  verification:
  - Run 15-minute harmless sustained CPU/I/O workload and produce valid thermal JSONL.
  required_artifacts:
  - benchmarks/stock/thermal_baseline.json
  - artifacts/runs/<run>/thermal.jsonl
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - Thermal/frequency time series can be correlated with benchmark time.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: B00
  title: Build llama.cpp/ggml Android baseline
  phase: backend
  priority: 20
  depends_on:
  - D04
  - D05
  - D06
  - R00
  optional: false
  goal: Establish a known C/C++ ARM baseline and gpt-oss-capable reference backend.
  allowed_paths:
  - third_party/**
  - scripts/**
  - benchmarks/**
  - artifacts/**
  - docs/**
  implementation:
  - Checkout pinned llama.cpp ref.
  - Build Android arm64 CPU baseline with reproducible flags.
  - Run same small fixture/model with fixed prompt/context/threads.
  - Capture RSS, prompt/decode rate and thermal.
  verification:
  - Binary/version records pinned ref.
  - At least 3 device runs.
  required_artifacts:
  - benchmarks/runtimes/llama_cpp.json
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - llama.cpp baseline runs on the physical phone and produces reproducible metrics.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: B01
  title: Evaluate MNN backend
  phase: backend
  priority: 21
  depends_on:
  - D04
  - D05
  - D06
  - R00
  optional: false
  goal: Measure MNN only on an equivalent operator/model fixture; avoid reputation-based selection.
  allowed_paths:
