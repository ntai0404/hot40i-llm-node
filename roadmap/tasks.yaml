  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: M03
  title: Quantize dense/shared candidates
  phase: model
  priority: 43
  depends_on:
  - M00
  - C04
  - B04
  optional: false
  goal: Reduce unavoidable resident dense memory while preserving acceptable correctness.
  allowed_paths:
