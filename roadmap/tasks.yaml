- id: B03
  title: Evaluate MLC/Mali path
  phase: backend
  priority: 23
  depends_on:
  - D04
  - D05
  - D06
  - R00
  optional: false
  goal: Determine whether MLC/OpenCL/Vulkan on the Mali-G57 path is useful versus CPU.
  allowed_paths:
  - third_party/**
  - scripts/**
  - benchmarks/**
  - artifacts/**
  - docs/**
  implementation:
  - Probe supported GPU compute APIs without rooting.
  - Build/run only if support is real; do not spend unbounded effort porting unsupported GPU paths.
  - Capture same metrics.
  verification:
  - Evidence either a runnable benchmark or a hardware/software support decision.
  required_artifacts:
  - benchmarks/runtimes/mlc.json
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - GPU path is measured or explicitly rejected with evidence.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: B04
  title: Select compute backend
  phase: backend
  priority: 24
  depends_on:
  - B00
  - B01
  - B02
  - B03
  optional: false
  goal: Choose the reusable compute-kernel base for the custom storage runtime.
  allowed_paths:
  - benchmarks/**
  - docs/decisions/**
  - PROJECT_STATE.yaml
  - artifacts/**
  implementation:
  - Compare identical/equivalent device evidence.
  - Score kernel coverage, speed, RSS, Android build complexity and gpt-oss/MXFP4 adaptation cost.
  - Record selected_compute_backend in PROJECT_STATE.yaml.
  - Prefer reusing kernels to writing matmul from scratch.
  verification:
  - Comparison script/table is generated from benchmark artifacts rather than hand-entered headline numbers.
  required_artifacts:
  - benchmarks/runtimes/comparison.json
  - docs/decisions/ADR_001_COMPUTE_BACKEND.md
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - One backend is selected with reproducible evidence and fallback order.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
- id: C00
  title: Generate tiny gpt-oss-shaped fixture
  phase: correctness
  priority: 30
  depends_on:
  - R01
  - B04
  optional: false
  goal: Create a small deterministic network that exercises the same operator classes without debugging 20B tensors.
  allowed_paths:
  - tests/**
  - tools/**
  - artifacts/**
  implementation:
  - Use official/reference semantics to create a tiny residual/MoE/attention/output network.
  - Include router, top-k expert weighting, gpt-oss SwiGLU behavior, attention pattern fixtures and deterministic
    weights/inputs.
  - Export golden intermediate tensors and metadata.
  verification:
  - Laptop reference reproduces identical outputs across two runs.
  required_artifacts:
  - tests/fixtures/tiny_gpt_oss/**
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - Golden fixture includes router IDs/scores, expert outputs, attention outputs, layer output and logits.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
