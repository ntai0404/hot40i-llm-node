  - scripts/**
  - benchmarks/**
  - artifacts/**
  - docs/**
  implementation:
  - Build pinned MNN Android target or record a reproducible incompatibility.
  - Use equivalent model/quant/context/thread conditions where technically possible.
  - Capture the same metrics as B00.
  verification:
  - Three runs if runnable; otherwise exact build/runtime blocker evidence.
  required_artifacts:
  - benchmarks/runtimes/mnn.json
  - artifacts/runs/<run>/evidence.json
  pass_criteria:
  - Runnable benchmark or rigorously evidenced incompatibility.
  failure_policy:
  - Record failure verbatim in evidence.
  - Fix only within task scope; retry verification.
  - If externally blocked, mark blocked and continue independent ready tasks.
